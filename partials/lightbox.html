  <!-- ============ LIGHTBOX ============ -->
  <dialog class="lightbox" id="lightbox">
    <figure class="lightbox__figure">
      <img class="lightbox__img" alt="">
      <figcaption class="lightbox__cap"><span class="lightbox__count"></span><span class="lightbox__text"></span></figcaption>
    </figure>
    <button class="lightbox__btn lightbox__close" type="button" data-lb="close" data-i18n-attr="aria-label:a11y.close" aria-label="Close"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button>
    <button class="lightbox__btn lightbox__prev" type="button" data-lb="prev" data-i18n-attr="aria-label:a11y.prev" aria-label="Previous photo"><svg class="icon" aria-hidden="true"><use href="#i-chevron-left"/></svg></button>
    <button class="lightbox__btn lightbox__next" type="button" data-lb="next" data-i18n-attr="aria-label:a11y.next" aria-label="Next photo"><svg class="icon" aria-hidden="true"><use href="#i-chevron-right"/></svg></button>
  </dialog>
